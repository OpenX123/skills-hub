name: deploy-pages

on:
  push:
    branches: [main]
    # registry 同步只改 web/public/data,也在这个范围内
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 部署不允许并发,但排队中的旧任务可以丢掉
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # base_path / base_url 由这一步给出,项目站点是 /<repo>,用户站点是 /
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      # 产物里有 _next/,下划线开头的目录会被 Jekyll 忽略
      - name: Disable Jekyll
        run: touch web/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
